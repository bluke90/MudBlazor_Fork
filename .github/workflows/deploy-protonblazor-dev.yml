name: deploy-protonblazor-dev

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-web-app:
    name: Deploy web app to dev.protonblazor.com
    if: ${{ github.repository_owner == 'ProtonBlazor' }}
    uses: ProtonBlazor/Workflows/.github/workflows/template-deploy-web-app.yml@main
    with:
      web-app-name: protonblazor-dev
      project-directory: './src/ProtonBlazor.Docs.WasmHost'
    secrets:
      publish-profile: ${{ secrets.PUBLISH_PROTONBLAZOR_DEV }}
